# Catalogo MySQL compartilhado para descoberta de servidores, arenas e partidas.
# Requer stats.yml enabled: true (mesmo MySQL usado pelos perfis).
# Cada servidor Spigot deve ter um server-id EXCLUSIVO, mapeado ao nome real no BungeeCord.
# O proxy usa este catalogo para reservas; a entrada final e revalidada no MatchEngineService.
enabled: false
server-id: 'bedwars-01'
lobby-server: 'auth' # Nome do lobby na configuracao do BungeeCord.
refresh-ticks: 100 # 5 segundos, heartbeat; proxy deve ignorar registros com mais de 30 s.
mysql-pool-size: 2
