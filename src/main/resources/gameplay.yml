# Gameplay classico. Alteracoes de selecao valem na proxima partida; cooldowns sao por partida.
kits:
  default:
    enabled: true
    names: {pt_BR: Padrao, en_US: Default, es_ES: Predeterminado}
    descriptions: {pt_BR: Quatro blocos para comecar., en_US: Four starting blocks., es_ES: Cuatro bloques iniciales.}
    icon: WOOL
    level: 1
    permission: ''
    modes: [solo, duo, trio, squad, custom]
    start-items:
      - {material: WOOL, amount: 4}
    respawn-items: []
    permanent-tool: ''
  builder:
    enabled: true
    names: {pt_BR: Construtor, en_US: Builder, es_ES: Constructor}
    descriptions: {pt_BR: Doze blocos no inicio., en_US: Twelve starting blocks., es_ES: Doce bloques iniciales.}
    icon: BRICK
    level: 5
    permission: ''
    modes: [solo, duo, trio, squad, custom]
    start-items:
      - {material: WOOL, amount: 12}
    respawn-items: []
    permanent-tool: ''
  warrior:
    enabled: true
    names: {pt_BR: Guerreiro, en_US: Warrior, es_ES: Guerrero}
    descriptions: {pt_BR: Uma maca dourada no inicio., en_US: One starting golden apple., es_ES: Una manzana dorada inicial.}
    icon: GOLDEN_APPLE
    level: 10
    permission: ''
    modes: [solo, duo, trio, squad, custom]
    start-items:
      - {material: GOLDEN_APPLE, amount: 1}
    respawn-items: []
    permanent-tool: ''
  miner:
    enabled: true
    names: {pt_BR: Minerador, en_US: Miner, es_ES: Minero}
    descriptions: {pt_BR: Picareta de pedra permanente., en_US: Permanent stone pickaxe., es_ES: Pico de piedra permanente.}
    icon: STONE_PICKAXE
    level: 10
    permission: ''
    modes: [solo, duo, trio, squad, custom]
    start-items: []
    respawn-items: []
    permanent-tool: STONE_PICKAXE
  explorer:
    enabled: true
    names: {pt_BR: Explorador, en_US: Explorer, es_ES: Explorador}
    descriptions: {pt_BR: Pocao de velocidade no inicio., en_US: Starting speed potion., es_ES: Pocion de velocidad inicial.}
    icon: COMPASS
    level: 15
    permission: ''
