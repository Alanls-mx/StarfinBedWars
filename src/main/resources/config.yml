config-version: 1

general:
  debug: false

match:
  respawn-seconds: 3
  spawn-opening-seconds: 10
  ender-pearl-damage: 4.0 # Pontos de vida: 4 = 2 coracoes; 0 desativa o dano.
  void-depth-below-lowest-block: 48 # Blocos abaixo do bloco solido mais baixo da arena.
  tnt-auto-prime: true # Colocar TNT durante a partida acende automaticamente o pavio.
  tnt-fuse-ticks: 40 # 2 segundos; entre 1 e 200 ticks.
  # Vitoria: 9 segundos para os fogos antes de retornar ao lobby.
  # Empates e encerramentos sem vencedor continuam com 5 segundos.
  victory-celebration-seconds: 9

next-match:
  enabled: true # Oferece jogar novamente no mesmo modo ou escolher arena apos o resultado.

# Itens especiais do BedWars classico (compra configurada em shop.yml).
special-items:
  enabled: true
  # Permanente por padrao, inclusive para configuracoes antigas com 30 segundos.
  defender-persistent: true
  # So utilizado se defender-persistent estiver false (0 significa ilimitado).
  defender-lifetime-seconds: 0
  magic-milk-seconds: 30

  # Ovo de Ponte: passagem reforcada na cor da equipe.
  # width aceita 1, 3 ou 5; thickness aceita 1 ou 2.
  bridge-egg:
    width: 3
    thickness: 2
    max-blocks: 480
    max-ticks: 70
    # A ponte permanece por 5 segundos depois que o ovo termina de construir.
    decay-delay-seconds: 5
    # Cada secao construida desaparece em ordem, do inicio ate a ponta.
    # 3 ticks = 0.15 segundo a 20 TPS.
    decay-interval-ticks: 3

  # Defensor de Sonhos: 0.75 reduz 25% do recuo horizontal,
  # 0.85 reduz 15% do vertical. 1.0 = comportamento vanilla.
  defender-knockback:
    horizontal: 0.75
    vertical: 0.85

# Match Point inicia com 30 minutos de partida: camas quebram e um dragao
# invulneravel destroi estruturas apenas na instancia temporaria do mapa.
match-point:
  enabled: true
  after-minutes: 30
  message: '&5&lMATCH POINT! &cTodas as camas foram destruídas! &dO dragão chegou!'
  dragon-height-offset: 3
  # Tamanho do proximo trecho de voo na rota natural do dragao (0.03 a 0.20).
  dragon-angular-speed: 0.065
  # Distancia maxima para considerar um waypoint visitado (2 a 5 blocos).
  # Evita o dragao ignorar as ilhas antes de chegar perto dos blocos.
  dragon-waypoint-reach: 4.0
  # Voo em X sobre toda a area MAIN (pos1/pos2), alternando diagonais.
  # Distancia entre waypoints. Nao ha varredura em grade.
  dragon-patrol-spacing: 40
  # Explosoes pequenas e CIRCULARES (estilo TNT), nao em X.
  # Intervalo 40 ticks = 2 segundos em 20 TPS.
  dragon-blast-interval-ticks: 40
  dragon-blast-radius: 3
  dragon-blast-depth: 1
  dragon-blast-blocks: 8
  # So explode depois de avancar alguns blocos.
  dragon-blast-min-movement: 5.0
  # Metas contadas desde o inicio do Match Point. Referencia:
  # total de blocos existentes na MAIN (pos1/pos2), excluindo ar e bedrock.
  # Caso o servidor fique atrasado, ele tenta recuperar o progresso em lotes.
  demolition:
    partial-minutes: 5
    partial-percent: 80
    complete-minutes: 8
    survey-positions-per-tick: 7000
    max-blocks-per-tick: 220
  # Raios visuais que tambem destroem estruturas durante o Match Point.
  # Desativar com lightning.enabled: false sem alterar as metas de destruicao.
  lightning:
    enabled: true
    interval-ticks: 60
    radius: 3
    max-blocks-per-strike: 24
  # Barra MATCH POINT fixa perto da camera, mesmo olhando para longe do dragao.
  bossbar-enabled: true
  dragon-damage-radius: 5.0
  dragon-damage: 5.0

arena-bounds:
  default-width: 280
  default-depth: 280
  default-up-height: 50
  default-down-depth: 50
  maximum-dimension: 1000

bed-alert:
  broadcast: '&cA cama da equipe {team} foi destruida por {player}!'
  broadcast-unknown: '&cA cama da equipe {team} foi destruida!'
  title: '&cCAMA DESTRUIDA!'
  subtitle: '&eVoce nao podera mais renascer!'
  sound: WITHER_DEATH
  volume: 0.7
  pitch: 1.0

shop-hologram:
  items-title: '&e&lLOJA'
  items-subtitle: '&7Clique para comprar'
  upgrades-title: '&e&lMELHORIAS'
  upgrades-subtitle: '&7Clique para abrir'
  height: 2.25
  line-spacing: 0.24

bed-hologram:
  enabled: true
  visibility: OWN_TEAM # OWN_TEAM, ALL_TEAMS ou DISABLED
  show-to-spectators: false
  height: 1.2
  intact: '&c&lDEFENDA SUA CAMA!'
  destroyed: '&c&lSUA CAMA FOI DESTRUIDA!'
  show-when-intact: true
  show-when-destroyed: true
  destroyed-duration-seconds: 5

generator-holograms:
  enabled: true
  text:
    enabled: true
    show-level: true
    show-resource: true
    show-countdown: true
    update-interval-ticks: 20
  central-block:
    enabled: true
    rotate: true
    rotation-speed: 4.0
    floating:
      enabled: true
      amplitude: 0.12
      period-ticks: 60
  orbit:
    enabled: true
    icon-count: 4
    radius: 1.05
    height-offset: 0.15
    rotation-speed: 6.0
    update-interval-ticks: 2
    vertical-oscillation:
      enabled: false
      amplitude: 0.05
  resources:
    diamond:
      central-material: DIAMOND_BLOCK
      orbit-material: DIAMOND
    emerald:
      central-material: EMERALD_BLOCK
      orbit-material: EMERALD
  performance:
    max-icons-per-generator: 8
    pause-when-no-viewers: true
    activation-distance: 48

purchase-sounds:
  shop: NOTE_PLING
  upgrade: LEVEL_UP
  volume: 0.8
  pitch: 1.25

shop-npc:
  fallback-to-team-spawn: true # Usa um ponto seguro proximo ao spawn se a loja do time nao tiver posicao valida.
  items-skin: AlanLS_
  upgrades-skin: Lurreisper

match-chat:
  format: '{channel}{tag}{player} &7> &f{message}'

tab:
  enabled: true
  isolate-matches: true # Lobby principal e cada partida mostram apenas seus proprios jogadores.
  # Placeholders: {arena}, {mode}, {players}, {max}, {footer}. Use \n para novas linhas.
  header: '&b&lSTARFIN BEDWARS\n{footer}'
  footer: '{footer}' # Usa scoreboard.footer; voce tambem pode escrever o texto diretamente aqui.
  team-prefixes: true
  team-prefix: '[{initial}] ' # {initial}, {team}; cor da equipe aplicada automaticamente.
  show-spectators: true
  spectator-prefix: '&7[S] '
  skins:
    enabled: true # Icones reais para contas originais e nomes premium em servidores offline.
    fallback-player: '' # Skin padrao para nomes piratas sem perfil premium; vazio mantem Steve/Alex.
    aliases: {} # Exemplo: MeuJogadorPirata: AlanLS_
  lobby:
    enabled: true # Mostra o TAB configurado tambem depois de sair da partida.
    header: '&b&lSTARFIN BEDWARS\n{footer}'
    footer: '{footer}'

scoreboard:
  enabled: true
  # Lobby PRINCIPAL: jogadores fora de qualquer arena. Separado de layouts.lobby
  # (sala de espera de uma partida). Desative se o StarfinLobby for dono da sidebar.
  main-lobby:
    enabled: true
    title: '&e&lBED WARS'
    # Variaveis: {player}, {date}, {level}, {xp}, {total_xp}, {xp_current}, {xp_required},
    # {xp_remaining}, {last_match_xp}, {wins}, {kills}, {final_kills}, {beds}, {games},
    # {win_rate}, {rank_position}, {selected_title},
    # {xp_bar}, {status},
    # {language}, {footer}. Os numeros sao obtidos do cache assincrono MySQL.
    lines:
      - '{date}'
      - ''
      - '&fNivel: &e{level}'
      - '&fXP: &b{xp_current}/{xp_required}'
      - '{xp_bar}'
      - ''
      - '&fPartidas: &a{games}'
      - '&fVitorias: &a{wins}'
      - '&fAbates: &a{kills}'
      - '&fAbates finais: &a{final_kills}'
      - '&fCamas: &a{beds}'
      - ''
      - '{footer}'
    languages:
      en_US:
        - '{date}'
        - ''
        - '&fLevel: &e{level}'
        - '&fXP: &b{xp_current}/{xp_required}'
        - '{xp_bar}'
        - ''
        - '&fGames: &a{games}'
        - '&fWins: &a{wins}'
        - '&fKills: &a{kills}'
        - '&fFinal kills: &a{final_kills}'
        - '&fBeds: &a{beds}'
        - ''
        - '{footer}'
      es_ES:
        - '{date}'
        - ''
        - '&fNivel: &e{level}'
        - '&fXP: &b{xp_current}/{xp_required}'
        - '{xp_bar}'
        - ''
        - '&fPartidas: &a{games}'
        - '&fVictorias: &a{wins}'
        - '&fBajas: &a{kills}'
        - '&fBajas finales: &a{final_kills}'
        - '&fCamas: &a{beds}'
        - ''
        - '{footer}'
  preset: CLASSIC # CLASSIC or LEGACY
  title: '&e&lBED WARS'
  footer: '&estarfinplugins&f.com.br'
  eliminated-display: ZERO # ZERO, TEXT or HIDE
  team-status: BED # BED, ALIVE, TEXT or COMPACT
  own-marker: '&e *'
  team-line: '{team_color}&l{team_initial} &f{team_name} {status}{own_marker}'
  # Cada entrada vira uma linha; use '' para espaco. Maximo de 15 linhas e 32 caracteres por linha no Minecraft 1.8.
  # Placeholders comuns: {date}, {arena_id}, {arena}, {footer}.
  # {footer} usa scoreboard.footer. Para um dominio proprio, altere scoreboard.footer,
  # ou substitua {footer} por um texto literal em cada layout.
  layouts:
    lobby:
      - '{date}  &8{arena_id}'
      - '&7Mapa: &a{arena}'
      - '&7Jogadores: &a{players}&7/{max}'
      - ''
      - '&e{countdown_title}'
      - '&a{countdown}'
      - ''
      - '&7Modo: &a{mode}'
      - ''
      - '{footer}'
    in-game:
      - '{date}  &8{arena_id}'
      - ''
      - '{next_upgrade_title}'
      - '{next_upgrade}'
      - ''
      - '{teams}' # Expande uma linha por equipe, usando team-line.
      - '{spectating}'
      - ''
      - '{footer}'
    ending:
      - '{date}  &8{arena_id}'
      - ''
      - '&ePartida encerrada'
      - '&fVencedor: &a{winner}'
      - '{result}'
      - ''
      - '{footer}'

chests:
  ender-mode: MATCH_SHARED

equipment:
  armor-mode: CLASSIC
  sword-minimum: WOOD
  tool-minimum: WOOD

shop:
  # Maximo de caracteres visiveis por linha da descricao (18 a 40).
  # Linhas menores evitam tooltips fora da tela em resolucoes baixas.
  description-line-length: 28
  category-order: [FAVORITES, BLOCKS, COMBAT, ARMOR, TOOLS, BOWS, POTIONS, UTILITIES]
  category-icons:
    FAVORITES: NETHER_STAR
    BLOCKS: STAINED_CLAY
    COMBAT: GOLD_SWORD
    ARMOR: CHAINMAIL_BOOTS
    TOOLS: IRON_PICKAXE
    BOWS: BOW
    POTIONS: BREWING_STAND_ITEM
    UTILITIES: TNT

visuals:
  lobby-countdown:
    start-at: 5
    title: '&e&lINICIANDO'
    subtitle: '&fA partida comeca em &e{time}&fs.'
    cancelled: '&cAguardando mais jogadores...'
    sound: NOTE_PLING
    sound-enabled: true
  countdown:
    start-at: 5
    subtitle: '&ePrepare-se!'
    sound: NOTE_PLING
    sound-enabled: true
    sound-volume: 0.7
    sound-pitch: 1.0
    particles: 3
  start:
    title: '&e&lBED WARS'
    subtitle: '&fProteja sua cama e elimine as equipes inimigas!'
    sound: LEVEL_UP
    sound-enabled: true
    particles: 0
  victory:
    title: '&a&lVITORIA!'
    subtitle: '&fSeu time venceu!'
    sound: FIREWORK_LAUNCH
    sound-enabled: true
    particles: 6
    celebration:
      enabled: true
      fireworks-per-burst: 4
      interval-ticks: 10
      radius: 6
  death:
    title: '&c&lVOCE MORREU!'
    subtitle: '&eRenascendo em &c{time} &esegundos.'
  defeat:
    title: '&c&lDERROTA!'
    subtitle: '&7Sua equipe foi eliminada!'
  draw:
    title: '&ePartida encerrada'
    subtitle: '&7Sem equipe vencedora'

