    fire: '&7{player} &7morreu queimado.'
    lava: '&7{player} &7caiu na lava.'
    drowning: '&7{player} &7se afogou.'
    explosion: '&7{player} &7foi explodido.'
    explosion-killer: '&7{player} &7foi explodido por &e{killer}&7.'
