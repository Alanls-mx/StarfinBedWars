  lobby-ready: '&aJogadores suficientes! &eA partida esta sendo preparada.'
  lobby-countdown: '&eA partida comeca em &6{time} &esegundos!'
  spawn-preparing: '&eAs equipes estao nas bases. Aguarde a abertura das barreiras.'
