name: StarfinBedWars
version: 1.0.0-SNAPSHOT
main: com.starfinplugins.bedwars.StarfinBedWarsPlugin
author: StarfinPlugins
website: https://starfinplugins.com.br
description: Premium BedWars foundation for Spigot 1.8.8
depend:
  - StarfinCore
  - Vault
softdepend:
  - StarfinMinigames
  - WorldEdit
commands:
  starfinbedwars:
    description: StarfinBedWars administration and status
    usage: /starfinbedwars <help|version|status|menu|arena|world|always|join|spectate|leave|chat|stats|profile|progress|rewards|top|ranked|kit|ability|scope|gameplay|matchpoint|migrate>
    aliases:
      - sbw
  reconnect:
    description: Retorna a partida BedWars pendente
    usage: /reconnect
permissions:
  starfinbedwars.kit.builder: {default: true}
  starfinbedwars.kit.miner: {default: true}
  starfinbedwars.kit.lumberjack: {default: true}
  starfinbedwars.kit.shears: {default: true}
  starfinbedwars.kit.carpenter: {default: true}
  starfinbedwars.kit.climber: {default: true}
  starfinbedwars.kit.blacksmith: {default: true}
  starfinbedwars.kit.archer: {default: true}
  starfinbedwars.kit.trapper: {default: true}
  starfinbedwars.kit.explorer: {default: true}
  starfinbedwars.kit.defender: {default: true}
  starfinbedwars.kit.pyromancer: {default: true}
  starfinbedwars.admin:
    description: Administrate StarfinBedWars
    default: op
    children:
      starfinbedwars.command.status: true
      starfinbedwars.command.arena: true
      starfinbedwars.command.world: true
      starfinbedwars.command.matchpoint: true
      starfinbedwars.command.gameplay.admin: true
      starfinbedwars.command.always: true
      starfinbedwars.ranked.admin: true
  starfinbedwars.ranked.admin:
    description: Inspecionar o sistema competitivo
    default: op
  starfinbedwars.command.status:
    description: View StarfinBedWars status
    default: op
  starfinbedwars.command.arena:
    description: Configure BedWars arenas
    default: op
  starfinbedwars.command.world:
    description: Manage StarfinBedWars worlds
    default: op
  starfinbedwars.command.matchpoint:
    description: Permite forcar o Match Point de uma partida ativa para testes
    default: op
  starfinbedwars.command.gameplay.admin:
    description: Recarrega e inspeciona kits, habilidades e regras de gameplay
    default: op
  starfinbedwars.command.always:
    description: Recarrega e inspeciona regras Always de mundos e arenas
    default: op
  starfinbedwars.afk.exempt:
    description: Isenta o jogador da remocao por inatividade
    default: op
  starfinbedwars.command.reconnect.admin:
    description: Inspect and invalidate reconnect sessions
    default: op
  starfinbedwars.chat.color:
    description: Permite usar codigos de cor com & nas mensagens da partida
    default: op
  starfinbedwars.teamselector.solo:
    description: Permite escolher a equipe manualmente no modo Solo
    default: op
